# カラム名内階層区切りの分離機能で使う区切り文字
# detect_column_hierarchy_split（step3）で使用する。カラム名がこのいずれかの
# 文字で区切られており、かつ同じ列のセル値も同じ文字で同じ個数に分割できる
# 場合、その位置で複数カラムに分離する
# （例: 列名 "帳票プラン1 / 帳票プラン2" ＋ 値 "フレッツ光 / おまかせLAN構築"
#  → "帳票プラン1", "帳票プラン2" の2列）。
# 記載順が優先順位。
#
# Wide_to_long の axis_delimiters.yaml とは用途が異なるため別辞書にする。
#
# axis_delimiters.yaml と違い "・"（中黒）を含める:
#   こちらはカラム名だけでなくセル値側の分割一致も必須条件にするため、
#   "支店・営業所" のような正当な日本語複合語は（セル値 "東京支店" 等に
#   "・" が現れないため）発火しない。
# "_" は含めない:
#   多段ヘッダー統合（merge_header_rows）が列名の連結に "_" を使うため、
#   統合済み列名を再分割してしまう衝突リスクが高い。

- "/"
- "／"
- ">"
- "＞"
- "・"
